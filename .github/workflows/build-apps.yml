name: Build apps

on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop app image (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: desktop-windows-exe-with-runtime
            artifact-path: desktopApp/build/compose/binaries/main/app/**
          - os: ubuntu-latest
            artifact-name: desktop-linux-with-runtime
            artifact-path: desktopApp/build/compose/binaries/main/app/**
          - os: macos-latest
            artifact-name: desktop-macos-with-runtime
            artifact-path: desktopApp/build/compose/binaries/main/app/**
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build desktop distributable with bundled runtime
        run: ./gradlew :desktopApp:createDistributable --stacktrace

      - name: Upload desktop app image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Attach artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack artifacts
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "${name}.zip" "$dir"
          done

      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
